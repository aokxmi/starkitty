# Don't print a new line at the start of the prompt
add_newline = false
# Pipes ╰─ ╭─
# Powerline symbols                                     
# Wedges 🭧🭒 🭣🭧🭓
# Random noise 🬖🬥🬔🬗
# Cool stuff 󰜥   

# format = """
# $directory $fill $git_branch $cmd_duration
#  $character"""
format = """
$line_break\
[](fg:2)\
$os\
[](bg:255 fg:2)\
$directory\
[ ](bg:243 fg:255)\
$git_branch\
$git_status\
[ ](bg:4 fg:243)\
$c\
$rust\
$lua\
$golang\
$nodejs\
$bun\
$php\
$java\
$kotlin\
$haskell\
$python\
[ ](bg:253 fg:4)\
$cmd_duration\
[](bg: 0 fg:253)\
$fill\
[](fg:2)\
$time\
[](fg:2)\
$line_break\
$character"""

[fill]
symbol = ' '
style = 'fg:245'

# Replace the "❯" symbol in the prompt with "➜"
[character] # The name of the module we are configuring is "character"
success_symbol = "[ ](bold fg:243)"
error_symbol = "[  ](bold fg:244)"

[os]
disabled = false
style = "bg:2 fg:255"

[os.symbols]
Arch = " \uf303  "
# Disable the package module, hiding it from the prompt completely
[package]
disabled = false

[git_branch]
style = "bg: 9"
symbol = "󰘬"
format = '[[$symbol $branch ](bold fg:253 bg:243)]($style)'

[git_commit]
commit_hash_length = 4
tag_symbol = " "

[git_status]
style = "bold bg:6 fg:13"
format = '[[($all_status$ahead_behind )](fg:253 bg:243)]($style)'
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
conflicted = "=${count}"
staged = "+${count}"
modified = "!${count}"
untracked = "?${count}"
deleted = "✘${count}"
renamed = "»${count}"
stashed = "$${count}"

#[hostname]
#ssh_only = false
#format =  "[•$hostname](bg:252 bold fg:235)[](bold fg:252)"
#trim_at = ".companyname.com"
#disabled = false

#[memory_usage]
#disabled = true
#threshold = -1
#symbol = " "
#style = "bold dimmed green"

[time]
disabled = false
format = '[[ $time ](fg:255 bg:2)]($style)'
style = "bg:254"
time_format = "%T"

#[username]
#style_user = "bold bg:252 fg:235"
#style_root = "red bold"
#format = "[](bold fg:252)[$user]($style)"
#disabled = false
#show_always = true

[directory]
home_symbol = ""
read_only = "  "
style = "bg:255 fg:240"
truncation_length = 0
truncate_to_repo = false
truncation_symbol = ".../"
format = '[ $path ]($style)[](bold fg:255)'


[directory.substitutions]
"Desktop" = "  "
"Documents" = "  "
"Downloads" = "  "
"Music" = " 󰎈 "
"Pictures" = "  "
"Videos" = "  "
"GitHub" = " 󰊤 "

[cmd_duration]
min_time = 0
format = '[$duration ](bold bg:253 fg:250)'

# langs 

[c]
symbol = " "
style = "bg:243"
format = '[[$symbol($version) ](fg:235 bg:4)]($style)'

[rust]
symbol = " "
style = "bg:243"
format = '[[$symbol($version) ](fg:235 bg:4)]($style)'

[python]
symbol = " "
style = "bg:243"
format = '[[$symbol($version) ](fg:235 bg:4)]($style)'

[nodejs]
symbol = " "
style = "bg:243"
format = '[[$symbol($version) ](fg:235 bg:4)]($style)'

[lua]
symbol = " "
style = "bg:243"
format = '[[$symbol($version) ](fg:235 bg:4)]($style)'
